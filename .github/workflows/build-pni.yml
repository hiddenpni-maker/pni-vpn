name: Build PNI Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Rust (for Aether core)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27 and Platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch GeoIP/GeoSite, Tor Bridges & CDN CIDRs
        run: bash scripts/fetch-assets.sh

      - name: Build Go Cores (pni-core.aar + libpnisingbox.so) & Run Go Tests
        run: bash scripts/build-cores.sh

      - name: Build Native Binaries (hev-socks5-tunnel, Tor, Lyrebird, Psiphon, Aether)
        run: bash scripts/build-binaries.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Unit Tests & Build APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease

      - name: Upload PNI APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pni-apks
          path: app/build/outputs/apk/**/*.apk
