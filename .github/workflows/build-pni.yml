name: Build PNI Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Configure Android NDK
        shell: bash
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          else
            NDK_PKG="$(sdkmanager --list | grep -oE 'ndk;[0-9.]+' | sort -V | tail -1)"
            yes | sdkmanager --install "$NDK_PKG" >/dev/null || true
            NDK_DIR="$ANDROID_HOME/${NDK_PKG/;/\/}"
          fi
          echo "Using NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Fetch GeoIP/GeoSite, Tor Bridges & CDN CIDRs
        shell: bash
        run: bash scripts/fetch-assets.sh

      - name: Cache Built Cores & Native Binaries
        id: cache-native
        uses: actions/cache@v4
        with:
          path: |
            app/libs/pni-core.aar
            app/src/main/jniLibs
          key: pni-native-v1-${{ hashFiles('core-go/**', 'scripts/build-cores.sh', 'scripts/build-binaries.sh') }}

      - name: Build Go Cores (pni-core.aar + libpnisingbox.so) & Run Go Tests
        if: steps.cache-native.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build-cores.sh

      - name: Build Native Binaries (hev-socks5-tunnel, Tor, Lyrebird, Psiphon, Aether, DNSTT)
        if: steps.cache-native.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build-binaries.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Unit Tests & Build Release APKs
        shell: bash
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Prepare Separate Release APK Files & Checksums
        shell: bash
        run: |
          mkdir -p release-assets
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src=$(ls app/build/outputs/apk/release/app-${abi}-release*.apk 2>/dev/null | head -1 || true)
            if [ -n "$src" ] && [ -f "$src" ]; then
              cp "$src" "release-assets/PNI-${abi}.apk"
            fi
          done
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Upload Individual APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PNI-arm64-v8a
          path: release-assets/PNI-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARMv7 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PNI-armeabi-v7a
          path: release-assets/PNI-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PNI-x86_64
          path: release-assets/PNI-x86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PNI-universal
          path: release-assets/PNI-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with Separate APK Links
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "PNI ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }} (Android)"
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            release-assets/PNI-arm64-v8a.apk
            release-assets/PNI-armeabi-v7a.apk
            release-assets/PNI-x86_64.apk
            release-assets/PNI-universal.apk
            release-assets/SHA256SUMS.txt
