name: Build PNI Windows Desktop

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Fetch Windows Native Cores and Geo Assets
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-windows-cores.ps1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Desktop and Shared Tests and Build Windows Packages
        shell: pwsh
        run: |
          gradle --no-daemon --stacktrace :core:model:test :core:shared:test :desktop:test :desktop:createReleaseDistributable :desktop:packageReleaseExe

      - name: Prepare Windows Portable Zip and Release Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          $exe = Get-ChildItem "desktop\build\compose\binaries\main-release\exe\*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Missing EXE installer in desktop\build\compose\binaries\main-release\exe" }
          Copy-Item $exe.FullName "release-windows\pnifox-windows-x64-setup.exe" -Force

          $appDir = Get-ChildItem "desktop\build\compose\binaries\main-release\app" -Directory | Select-Object -First 1
          if (-not $appDir) { throw "Missing distributable app folder" }
          Compress-Archive -Path $appDir.FullName -DestinationPath "release-windows\pnifox-windows-x64-portable.zip" -CompressionLevel Optimal -Force

          Get-FileHash release-windows\* -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content -Path "release-windows\SHA256SUMS-windows.txt" -Encoding ASCII

          Get-ChildItem release-windows | Format-Table Name, Length -AutoSize

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnifox-windows-x64-setup
          path: release-windows/pnifox-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnifox-windows-x64-portable
          path: release-windows/pnifox-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows Assets to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: |
            release-windows/pnifox-windows-x64-setup.exe
            release-windows/pnifox-windows-x64-portable.zip
            release-windows/SHA256SUMS-windows.txt
